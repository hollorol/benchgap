# Test, then upload the benchgap.net website (web/) over FTPS on every push to
# main, or by hand from the Actions tab / `gh workflow run deploy.yml`; a failing
# test stops the upload.
# Only the code is uploaded: the data (update-data.yml) and config.php stay on
# the server as they are.
# Repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
name: Deploy benchgap.net

on:
  push:
    branches: [main]
  workflow_dispatch:

# never run two uploads at once; a newer push waits for the running one
concurrency:
  group: deploy-benchgap-net
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://benchgap.net/
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Install the backend's dependencies (web/vendor)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --working-dir web

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # on the readable assets, before they are minified
      - name: Run the tests
        run: |
          uv venv --python 3.12 && uv pip install ".[dev]"
          .venv/bin/python -m pytest -q
        env:
          PYTHONWARNINGS: ignore

      # the repo keeps the readable source (ES modules the browser loads as they are); the uploaded
      # copy is bundled and minified: app.js (the router and what every page shares) and a chunk per
      # page under assets/chunks/, named by content (.htaccess keeps them), loaded when the page opens
      - name: Bundle app.js, minify style.css
        run: |
          npx --yes esbuild@0.28.2 web/assets/app.js --bundle --splitting --format=esm --minify --target=es2020 \
            --outdir=web/assets --chunk-names='chunks/[name]-[hash]' --allow-overwrite
          npx --yes esbuild@0.28.2 web/assets/style.css --minify --outdir=web/assets --allow-overwrite
          rm -r web/assets/js

      - name: Upload web/ over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./web/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            config*.php
