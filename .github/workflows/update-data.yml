# Rebuild benchgap.net's data from BenchLM every day, or by hand from the
# Actions tab / `gh workflow run update-data.yml`.
#
# Downloads BenchLM's newest results, recomputes every calibration and
# estimate, and replaces all of the site's data on the server in one swap
# (scripts/load_database.sh): visitors never see a half-loaded site, and every
# page, the API and llms.txt show the new data and dates right away.
# Fits whose training data did not change since the last run come from the fit
# cache (identical results), so a normal day takes a minute or two instead of
# the ~2 hours of a cold build (most of it the fits across capabilities); a run cut
# off midway keeps the fits it finished, and the next one carries on from them.
# Repository secrets: SSH_HOST, SSH_USER, SSH_PASSWORD.
name: Update the data

on:
  schedule:
    - cron: "23 5 * * *"  # daily, 05:23 UTC
  workflow_dispatch:

# one update at a time; never cut one off halfway through loading
concurrency:
  group: update-benchgap-data
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONWARNINGS: ignore
  # the server's SSH host key: the job refuses any other
  HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIAAIvuWmvxKADGHRtm69C8x1WFRCW+b0Tr1kL7aX+mx

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install benchgap
        run: uv venv --python 3.12 && uv pip install .

      - name: Download BenchLM's results
        run: .venv/bin/python scripts/build_seed.py --fetch

      # the newest run's fits; results of another fitting version (cache.VERSION) are not reused
      - name: Restore the fit cache
        uses: actions/cache/restore@v4
        with:
          path: .fit-cache
          key: fit-cache-${{ github.run_id }}
          restore-keys: fit-cache-

      # the steps' timeouts add up to less than the job's, so the fit cache is still saved
      - name: Compute every calibration and estimate
        timeout-minutes: 60
        run: |
          bg() { .venv/bin/benchgap --db "$RUNNER_TEMP/benchgap.db" "$@"; }
          bg init
          bg ingest
          bg fit --cache .fit-cache | tail -1
          bg multifit --cache .fit-cache | tail -1
          bg gapfill | tail -1

      # for the cross-domain view only (no estimate uses it): if it fails or runs out of
      # time, the data is loaded without it, and the next run carries on from its fits
      - name: Fit across capabilities
        timeout-minutes: 120
        continue-on-error: true
        run: .venv/bin/benchgap --db "$RUNNER_TEMP/benchgap.db" crossfit --cache .fit-cache

      - name: Fit each benchmark from several
        timeout-minutes: 45
        continue-on-error: true
        run: .venv/bin/benchgap --db "$RUNNER_TEMP/benchgap.db" crossmultifit --cache .fit-cache

      # the harness-tax analysis (measured scores only; never used for estimates):
      # pairs, metrics and the audit queue into the database (exported with it),
      # plus the append-only history, which the cache carries between runs
      - name: Restore the harness-tax history
        uses: actions/cache/restore@v4
        with:
          path: data/harness_tax_history.jsonl
          key: harness-tax-history-${{ github.run_id }}
          restore-keys: harness-tax-history-

      # a registered benchmark that BenchLM dropped or renamed stops the analysis: the
      # day's data is loaded without it (its tables empty) rather than not at all
      - name: Measure the harness tax
        continue-on-error: true
        run: .venv/bin/benchgap --db "$RUNNER_TEMP/benchgap.db" harness-tax
          --output data/harness_tax.json --history data/harness_tax_history.jsonl

      - name: Save the harness-tax history
        if: always() && hashFiles('data/harness_tax_history.jsonl') != ''
        uses: actions/cache/save@v4
        with:
          path: data/harness_tax_history.jsonl
          key: harness-tax-history-${{ github.run_id }}

      - name: Write the database
        run: |
          .venv/bin/benchgap --db "$RUNNER_TEMP/benchgap.db" sql "$RUNNER_TEMP/benchgap.sql"
          gzip -1 "$RUNNER_TEMP/benchgap.sql"

      # also when a later stage fails or runs out of time: the fits done so far are kept
      - name: Save the fit cache
        if: always() && hashFiles('.fit-cache/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .fit-cache
          key: fit-cache-${{ github.run_id }}

      - name: Load it on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        # the server takes a password only; ssh asks the askpass script for it
        run: |
          echo "$SSH_HOST $HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\\n" "$SSHPASS"\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force \
            ssh -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes \
            -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password \
            "$SSH_USER@$SSH_HOST" "bash -c $(printf %q "$(cat scripts/load_database.sh)")" \
            < "$RUNNER_TEMP/benchgap.sql.gz"
