[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchgap"
version = "0.1.0"
description = "Benchmark score database with deterministic gapfilling of missing scores via fitted cross-version mappings"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
report = ["matplotlib>=3.7"]

[project.scripts]
benchgap = "benchgap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
benchgap = ["families.json"]
